<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RecruitFlow</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="main-view">
  <div class="popup-header">
    <div class="logo">
      <div class="logo-icon">RF</div>
      <span class="logo-text">RecruitFlow</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="refresh-btn" id="refreshBtn" title="Refresh">↻</button>
    </div>
  </div>

  <div class="hero-area">
    <svg width="280" height="160" viewBox="0 0 280 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <radialGradient id="cg" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
      </radialGradient>
      <ellipse cx="140" cy="80" rx="80" ry="55" fill="url(#cg)"/>
      <path d="M80 62 Q110 48 140 80" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".7"/>
      <path d="M200 62 Q175 48 140 80" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".7"/>
      <path d="M108 138 Q124 120 140 80" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".7"/>
      <path d="M172 138 Q158 120 140 80" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity=".7"/>
      <rect x="64" y="52" width="18" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M64 54 L73 61 L82 54" stroke="#2563EB" stroke-width="1.2" fill="none"/>
      <rect x="196" y="52" width="18" height="12" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <path d="M196 54 L205 61 L214 54" stroke="#7C3AED" stroke-width="1.2" fill="none"/>
      <rect x="98" y="136" width="18" height="12" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M98 138 L107 145 L116 138" stroke="#2563EB" stroke-width="1.2" fill="none"/>
      <rect x="162" y="136" width="18" height="12" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <path d="M162 138 L171 145 L180 138" stroke="#7C3AED" stroke-width="1.2" fill="none"/>
      <circle cx="80" cy="42" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="80" cy="38" r="5" fill="#2563EB"/>
      <path d="M68 52 Q80 45 92 52" stroke="#2563EB" stroke-width="1.2" fill="none"/>
      <circle cx="200" cy="42" r="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
      <circle cx="200" cy="38" r="5" fill="#7C3AED"/>
      <path d="M188 52 Q200 45 212 52" stroke="#7C3AED" stroke-width="1.2" fill="none"/>
      <circle cx="107" cy="150" r="13" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="107" cy="146" r="4" fill="#2563EB"/>
      <path d="M98 156 Q107 150 116 156" stroke="#2563EB" stroke-width="1.2" fill="none"/>
      <circle cx="173" cy="150" r="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
      <circle cx="173" cy="146" r="4" fill="#7C3AED"/>
      <path d="M164 156 Q173 150 182 156" stroke="#7C3AED" stroke-width="1.2" fill="none"/>
      <linearGradient id="cf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EFF6FF"/><stop offset="100%" stop-color="#EDE9FE"/></linearGradient>
      <circle cx="140" cy="80" r="26" fill="white" stroke="#2563EB" stroke-width="2"/>
      <circle cx="140" cy="80" r="24" fill="url(#cf)"/>
      <circle cx="140" cy="74" r="8" fill="#2563EB"/>
      <path d="M122 93 Q140 84 158 93" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round"/>
      <g fill="#7C3AED" opacity=".45">
        <path d="M50 96 l2-4 l2 4 l-4 0z" transform="rotate(45 50 96)"/>
        <path d="M238 105 l2-4 l2 4 l-4 0z" transform="rotate(45 238 105)"/>
        <path d="M145 20 l2-3.5 l2 3.5 l-4 0z" transform="rotate(45 145 20)"/>
      </g>
      <circle cx="44" cy="78" r="2.5" fill="#93C5FD" opacity=".8"/>
      <circle cx="240" cy="78" r="2" fill="#C4B5FD" opacity=".8"/>
    </svg>
  </div>

  <p id="greeting" class="popup-greeting">Welcome to RecruitFlow! 👋</p>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="todayCount">–</div>
      <div class="stat-label">Sent today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="aiLeft">–</div>
      <div class="stat-label">AI uses left</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalSent">–</div>
      <div class="stat-label">Total sent</div>
    </div>
  </div>

  <button class="btn-primary" id="openSidebar">✦ Open Sidebar on LinkedIn</button>

  <div class="popup-footer">
    <span class="version">v1.0.0</span>
    <span class="divider">·</span>
    <span class="pro-badge" id="planBadge">Free</span>
    <span class="divider">·</span>
    <button class="logout-btn" id="settingsLink">Settings ↗</button>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
