<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecruitFlow</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-header">
    <div class="logo">
      <div class="logo-icon">RF</div>
      <span class="logo-text">RecruitFlow</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" title="Refresh stats">↻</button>
  </div>

  <div class="hero-area">
    <svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Soft glow behind center -->
      <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
      </radialGradient>
      <ellipse cx="140" cy="90" rx="80" ry="60" fill="url(#centerGlow)"/>

      <!-- Connection lines (curved) -->
      <path d="M 80 70 Q 110 55 140 90" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.7"/>
      <path d="M 200 70 Q 175 55 140 90" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.7"/>
      <path d="M 110 148 Q 125 130 140 90" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.7"/>
      <path d="M 170 148 Q 158 130 140 90" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none" opacity="0.7"/>

      <!-- Envelope icons at line ends -->
      <rect x="64" y="60" width="18" height="13" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M64 62 L73 69 L82 62" stroke="#2563EB" stroke-width="1.2" fill="none"/>

      <rect x="196" y="60" width="18" height="13" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <path d="M196 62 L205 69 L214 62" stroke="#7C3AED" stroke-width="1.2" fill="none"/>

      <rect x="100" y="148" width="18" height="13" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M100 150 L109 157 L118 150" stroke="#2563EB" stroke-width="1.2" fill="none"/>

      <rect x="162" y="148" width="18" height="13" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
      <path d="M162 150 L171 157 L180 150" stroke="#7C3AED" stroke-width="1.2" fill="none"/>

      <!-- Satellite profile nodes -->
      <circle cx="80" cy="48" r="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="80" cy="44" r="5" fill="#2563EB"/>
      <path d="M67 60 Q80 52 93 60" stroke="#2563EB" stroke-width="1.2" fill="none"/>

      <circle cx="200" cy="48" r="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
      <circle cx="200" cy="44" r="5" fill="#7C3AED"/>
      <path d="M187 60 Q200 52 213 60" stroke="#7C3AED" stroke-width="1.2" fill="none"/>

      <circle cx="109" cy="162" r="15" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
      <circle cx="109" cy="158" r="4" fill="#2563EB"/>
      <path d="M99 170 Q109 163 119 170" stroke="#2563EB" stroke-width="1.2" fill="none"/>

      <circle cx="171" cy="162" r="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
      <circle cx="171" cy="158" r="4" fill="#7C3AED"/>
      <path d="M161 170 Q171 163 181 170" stroke="#7C3AED" stroke-width="1.2" fill="none"/>

      <!-- Central profile node (larger) -->
      <circle cx="140" cy="90" r="28" fill="white" stroke="#2563EB" stroke-width="2"/>
      <linearGradient id="centerFill" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#EFF6FF"/>
        <stop offset="100%" stop-color="#EDE9FE"/>
      </linearGradient>
      <circle cx="140" cy="90" r="26" fill="url(#centerFill)"/>
      <circle cx="140" cy="84" r="8" fill="#2563EB"/>
      <path d="M122 104 Q140 94 158 104" stroke="#2563EB" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Sparkle dots -->
      <g fill="#7C3AED" opacity="0.5">
        <path d="M 50 105 l2 -4 l2 4 l-4 0 z" transform="rotate(45 50 105)"/>
        <path d="M 238 115 l2 -4 l2 4 l-4 0 z" transform="rotate(45 238 115)"/>
        <path d="M 145 28 l2 -3.5 l2 3.5 l-4 0 z" transform="rotate(45 145 28)"/>
        <path d="M 54 140 l1.5 -3 l1.5 3 l-3 0 z" transform="rotate(45 54 140)"/>
        <path d="M 230 50 l1.5 -3 l1.5 3 l-3 0 z" transform="rotate(45 230 50)"/>
      </g>
      <circle cx="44" cy="88" r="2.5" fill="#93C5FD" opacity="0.8"/>
      <circle cx="240" cy="88" r="2" fill="#C4B5FD" opacity="0.8"/>
      <circle cx="140" cy="20" r="2" fill="#93C5FD" opacity="0.6"/>
      <circle cx="50" cy="125" r="1.5" fill="#C4B5FD" opacity="0.7"/>
      <circle cx="235" cy="132" r="1.5" fill="#93C5FD" opacity="0.7"/>
    </svg>
  </div>

  <div class="tagline">AI-powered LinkedIn outreach for recruiters</div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="todayCount">–</div>
      <div class="stat-label">Sent today</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="aiLeft">–</div>
      <div class="stat-label">AI uses left</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalSent">–</div>
      <div class="stat-label">Total sent</div>
    </div>
  </div>

  <button class="btn-primary" id="openSidebar">✦ Open on LinkedIn</button>

  <div class="popup-footer">
    <span class="version">v1.0.0</span>
    <span class="divider">·</span>
    <a class="settings-link" id="settingsLink" href="#">Settings</a>
    <span class="divider">·</span>
    <span class="pro-badge">Free</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
